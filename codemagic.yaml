workflows:
  build-android-debug:
    name: Moodle App WMSOLUTIONS - DEBUG Android 16 API 36
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
      groups:
      - wmsolutions_keystore_group
      vars:
        PACKAGE_NAME: co.com.wmsolutions.moodleapp
        APP_NAME: Moodle WMSOLUTIONS
    scripts:
    - name: Instalar dependencias limpias
      script: |
        set -e

        echo "Node / npm:"
        node --version
        npm --version

        # Migración controlada: regenerar dependencias y lock desde package.json.
        rm -rf node_modules
        rm -rf cordova-plugin-moodleapp/node_modules
        rm -rf .angular
        rm -rf plugins
        rm -f package-lock.json

        npm cache verify || true
        npm install --include=dev --legacy-peer-deps --no-audit --no-fund

        echo "Angular/Ionic instalados:"
        npm ls @angular/core @angular/cli @angular-devkit/build-angular @angular-builders/custom-webpack --depth=0
        npm ls @ionic/cli cordova cordova-android cordova-sqlite-storage --depth=0

        echo "Angular CLI:"
        npx ng version

        # cordova-res no viene como dependencia local del proyecto.
        npm install -g cordova-res
    - name: Instalar Android SDK API 36
      script: |
        set -e

        # En las máquinas macOS de Codemagic, sdkmanager existe pero
        # normalmente no está incluido directamente en PATH.
        SDKMANAGER="$(command -v sdkmanager || true)"

        if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ] &&              [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        fi

        if [ -z "$SDKMANAGER" ] &&              [ -x "/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"
        fi

        if [ -z "$SDKMANAGER" ]; then
          SDKMANAGER="$(find /usr/local/share/android-sdk "${HOME}/Library/Android/sdk"               -path '*/cmdline-tools/*/bin/sdkmanager' -type f 2>/dev/null | head -n 1 || true)"
        fi

        if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
          echo "No se encontró sdkmanager."
          echo "ANDROID_HOME=${ANDROID_HOME:-no definido}"
          echo "Contenido de /usr/local/share/android-sdk/cmdline-tools:"
          ls -la /usr/local/share/android-sdk/cmdline-tools 2>/dev/null || true
          exit 1
        fi

        echo "Usando sdkmanager: $SDKMANAGER"
        "$SDKMANAGER" --version

        # Aceptar licencias si fuera necesario y asegurar API 36.
        yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
        "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

        echo "Paquetes API 36 instalados:"
        "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36\.0\.0' || true
    - name: Restaurar google-services.json
      script: |
        set -e
        if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
          echo "Falta GOOGLE_SERVICES_JSON_B64 en wmsolutions_keystore_group"
          exit 1
        fi

        ( printf "%s" "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json ) || \
        ( printf "%s" "$GOOGLE_SERVICES_JSON_B64" | base64 -d        > google-services.json ) || \
        ( printf "%s" "$GOOGLE_SERVICES_JSON_B64" | base64 -D        > google-services.json )

        if grep -q "\"package_name\"[[:space:]]*:[[:space:]]*\"${PACKAGE_NAME}\"" google-services.json; then
          echo "google-services.json OK para ${PACKAGE_NAME}"
        else
          echo "google-services.json no corresponde a ${PACKAGE_NAME}"
          exit 1
        fi
    - name: Limpiar y compilar web
      script: |
        set -e
        rm -rf www platforms/android .angular || true
        rm -rf node_modules/.cache || true
        rm -rf ~/.gradle/caches/build-cache-* || true

        echo "Compilando web con las CLI locales del proyecto..."
        BUILD_STATUS=0
        NODE_OPTIONS=--max-old-space-size=6144 \
          npx ionic build --configuration=development --verbose || BUILD_STATUS=$?

        if [ "$BUILD_STATUS" -ne 0 ]; then
          echo ""
          echo "===== DETALLE DEL ERROR DE ANGULAR ====="
          find /private/var/folders /tmp \
            -type f -name angular-errors.log -mmin -15 2>/dev/null \
            -print -exec sh -c 'echo "---"; cat "$1"' _ {} \; || true
          echo "========================================"
          exit "$BUILD_STATUS"
        fi

        test -f www/index.html || { echo "No se generó www/index.html"; exit 1; }
    - name: Preparar recursos y Android 15.0.0
      script: |
        set -e
        [ -f resources/icon.png ] || { echo "Falta resources/icon.png"; exit 1; }
        [ -f resources/android/logo.png ] || { echo "Falta resources/android/logo.png"; exit 1; }

        mkdir -p resources/android
        cp resources/icon.png resources/android/icon-foreground.png
        cp resources/icon.png resources/android/icon-background.png
        npx ionic cordova resources android --force --icon || true

        npx ionic cordova platform add android@15.0.0
        npx ionic cordova clean android || true

        echo "Plataformas instaladas:"
        npx cordova platform ls
    - name: Forzar LazySodium y JNA compatibles con 16 KB
      script: |
        set -e

        EXTRAS="platforms/android/app/build-extras.gradle"

        cat > "$EXTRAS" <<'EOF'
        configurations.configureEach {
            resolutionStrategy {
                force 'com.goterl:lazysodium-android:5.2.0'
                force 'net.java.dev.jna:jna:5.17.0'
            }
        }
        EOF

        echo "build-extras.gradle creado:"
        cat "$EXTRAS"

        echo ""
        echo "Las versiones se verificarán después del primer build."
        echo "Nota: cordova-android genera/prepara el Gradle Wrapper durante la compilación."
    - name: Compilar APK DEBUG
      script: |
        set -e
        npx ionic cordova build android --debug -- --packageType=apk
    - name: Verificar dependencias 16 KB después del build
      script: |
        set -e

        cd platforms/android

        if [ ! -x "./gradlew" ]; then
          echo "ERROR: gradlew no fue generado después del build."
          ls -la
          exit 1
        fi

        echo "Resolución LazySodium:"
        LAZY_OUT="$(./gradlew :app:dependencyInsight \
          --dependency lazysodium-android \
          --configuration debugRuntimeClasspath \
          --console=plain)"
        printf '%s\n' "$LAZY_OUT"

        if ! printf '%s\n' "$LAZY_OUT" | grep -Eq 'com\.goterl:lazysodium-android:5\.2\.0'; then
          echo "ERROR: Gradle no seleccionó lazysodium-android 5.2.0"
          exit 1
        fi

        echo ""
        echo "Resolución JNA:"
        JNA_OUT="$(./gradlew :app:dependencyInsight \
          --dependency jna \
          --configuration debugRuntimeClasspath \
          --console=plain)"
        printf '%s\n' "$JNA_OUT"

        if ! printf '%s\n' "$JNA_OUT" | grep -Eq 'net\.java\.dev\.jna:jna:5\.17\.0'; then
          echo "ERROR: Gradle no seleccionó JNA 5.17.0"
          exit 1
        fi

        echo ""
        echo "Dependencias 16 KB correctas en DEBUG:"
        echo " - LazySodium 5.2.0"
        echo " - JNA 5.17.0"
    artifacts:
    - platforms/android/app/build/outputs/apk/debug/*.apk
    - package-lock.json
  build-android-release:
    name: Moodle App WMSOLUTIONS - RELEASE AAB API 36 + 16KB
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
      groups:
      - wmsolutions_keystore_group
      vars:
        PACKAGE_NAME: co.com.wmsolutions.moodleapp
        APP_NAME: Moodle WMSOLUTIONS
    scripts:
    - name: Instalar dependencias limpias
      script: |
        set -e

        echo "Node / npm:"
        node --version
        npm --version

        # Migración controlada: regenerar dependencias y lock desde package.json.
        rm -rf node_modules
        rm -rf cordova-plugin-moodleapp/node_modules
        rm -rf .angular
        rm -rf plugins
        rm -f package-lock.json

        npm cache verify || true
        npm install --include=dev --legacy-peer-deps --no-audit --no-fund

        echo "Angular/Ionic instalados:"
        npm ls @angular/core @angular/cli @angular-devkit/build-angular @angular-builders/custom-webpack --depth=0
        npm ls @ionic/cli cordova cordova-android cordova-sqlite-storage --depth=0

        echo "Angular CLI:"
        npx ng version

        # cordova-res no viene como dependencia local del proyecto.
        npm install -g cordova-res
    - name: Instalar Android SDK API 36
      script: |
        set -e

        # En las máquinas macOS de Codemagic, sdkmanager existe pero
        # normalmente no está incluido directamente en PATH.
        SDKMANAGER="$(command -v sdkmanager || true)"

        if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ] &&              [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        fi

        if [ -z "$SDKMANAGER" ] &&              [ -x "/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"
        fi

        if [ -z "$SDKMANAGER" ]; then
          SDKMANAGER="$(find /usr/local/share/android-sdk "${HOME}/Library/Android/sdk"               -path '*/cmdline-tools/*/bin/sdkmanager' -type f 2>/dev/null | head -n 1 || true)"
        fi

        if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
          echo "No se encontró sdkmanager."
          echo "ANDROID_HOME=${ANDROID_HOME:-no definido}"
          echo "Contenido de /usr/local/share/android-sdk/cmdline-tools:"
          ls -la /usr/local/share/android-sdk/cmdline-tools 2>/dev/null || true
          exit 1
        fi

        echo "Usando sdkmanager: $SDKMANAGER"
        "$SDKMANAGER" --version

        # Aceptar licencias si fuera necesario y asegurar API 36.
        yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
        "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

        echo "Paquetes API 36 instalados:"
        "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36\.0\.0' || true
    - name: Restaurar google-services.json (Firebase)
      script: |
        set -e
        if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
          echo "Falta GOOGLE_SERVICES_JSON_B64 en wmsolutions_keystore_group"
          exit 1
        fi

        echo "Restaurando google-services.json..."
        ( printf "%s" "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json ) || \
        ( printf "%s" "$GOOGLE_SERVICES_JSON_B64" | base64 -d        > google-services.json ) || \
        ( printf "%s" "$GOOGLE_SERVICES_JSON_B64" | base64 -D        > google-services.json )

        echo "Validando package_name esperado (${PACKAGE_NAME})..."
        if grep -q "\"package_name\"[[:space:]]*:[[:space:]]*\"${PACKAGE_NAME}\"" google-services.json; then
          echo "google-services.json contiene ${PACKAGE_NAME}"
        else
          echo "El google-services.json no corresponde a ${PACKAGE_NAME}"
          echo "Paquetes encontrados:"
          grep -o "\"package_name\"[^\"]*\"[^\"]*\"" google-services.json | \
            sed 's/.*"package_name":[[:space:]]*"\([^"]*\)".*/ - \1/'
          exit 1
        fi
    - name: Limpiar y compilar web (Ionic)
      script: |
        set -e
        rm -rf www platforms/android .angular || true
        rm -rf node_modules/.cache || true
        rm -rf ~/.gradle/caches/build-cache-* || true

        echo "Compilando web de producción con las CLI locales..."
        BUILD_STATUS=0
        NODE_ENV=production NODE_OPTIONS=--max-old-space-size=6144 \
          npx ionic build --prod --verbose || BUILD_STATUS=$?

        if [ "$BUILD_STATUS" -ne 0 ]; then
          echo ""
          echo "===== DETALLE DEL ERROR DE ANGULAR ====="
          find /private/var/folders /tmp \
            -type f -name angular-errors.log -mmin -15 2>/dev/null \
            -print -exec sh -c 'echo "---"; cat "$1"' _ {} \; || true
          echo "========================================"
          exit "$BUILD_STATUS"
        fi

        test -f www/index.html || { echo "No se generó www/index.html"; exit 1; }
    - name: Recursos y plataforma Android 15.0.0
      script: |
        set -e
        [ -f resources/icon.png ] || { echo "Falta resources/icon.png"; exit 1; }
        [ -f resources/android/logo.png ] || { echo "Falta resources/android/logo.png"; exit 1; }

        mkdir -p resources/android
        cp resources/icon.png resources/android/icon-foreground.png
        cp resources/icon.png resources/android/icon-background.png
        npx ionic cordova resources android --force --icon || true

        npx ionic cordova platform add android@15.0.0
        npx ionic cordova clean android || true

        echo "Plataformas instaladas:"
        npx cordova platform ls

        echo "Comprobando configuración API 36 generada..."
        grep -R "cdvTargetSdkVersion" platforms/android/gradle.properties \
          platforms/android/app/build.gradle 2>/dev/null || true
        grep -R "compileSdk" platforms/android/app/build.gradle 2>/dev/null || true
    - name: Forzar LazySodium y JNA compatibles con 16 KB
      script: |
        set -e

        EXTRAS="platforms/android/app/build-extras.gradle"

        cat > "$EXTRAS" <<'EOF'
        configurations.configureEach {
            resolutionStrategy {
                force 'com.goterl:lazysodium-android:5.2.0'
                force 'net.java.dev.jna:jna:5.17.0'
            }
        }
        EOF

        echo "build-extras.gradle creado:"
        cat "$EXTRAS"

        echo ""
        echo "Las versiones se verificarán después de generar el AAB."
        echo "Nota: cordova-android genera/prepara el Gradle Wrapper durante la compilación."
    - name: 'HOTFIX: Desactivar minify/shrink'
      script: |
        set -e
        AND_APP_DIR="platforms/android/app"
        mkdir -p "$AND_APP_DIR"

        EXTRAS="$AND_APP_DIR/build-extras.gradle"

        cat >> "$EXTRAS" <<'EOF'

        android {
            buildTypes {
                release {
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }
        EOF

        sed -i.bak '/android.enableR8/d' platforms/android/gradle.properties 2>/dev/null || true

        echo "build-extras.gradle final:"
        cat "$EXTRAS"
        echo "minify/shrink desactivados sin perder el force de dependencias 16 KB."
    - name: Sanity check del keystore
      script: |
        set -e
        for v in CM_KEYSTORE CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
          [ -n "${!v:-}" ] || { echo "Falta $v en wmsolutions_keystore_group"; exit 1; }
        done

        echo "Restaurando /tmp/release.keystore..."
        ( printf "%s" "$CM_KEYSTORE" | base64 --decode > /tmp/release.keystore ) || \
        ( printf "%s" "$CM_KEYSTORE" | base64 -d        > /tmp/release.keystore ) || \
        ( printf "%s" "$CM_KEYSTORE" | base64 -D        > /tmp/release.keystore )

        [ -s /tmp/release.keystore ] || { echo "Keystore vacío o corrupto"; exit 1; }

        echo "Validando STOREPASS..."
        if ! keytool -list -v \
          -keystore /tmp/release.keystore \
          -storepass "$CM_KEYSTORE_PASSWORD" \
          >/tmp/ksinfo.txt 2>/dev/null; then
          echo "Store password (CM_KEYSTORE_PASSWORD) incorrecto."
          exit 1
        fi

        TYPE=$(grep -i "Keystore type:" /tmp/ksinfo.txt | awk -F': ' '{print $2}' | tr '[:upper:]' '[:lower:]')
        [ -z "$TYPE" ] && TYPE="jks"
        echo "Keystore type: $TYPE"

        echo "Validando ALIAS y KEYPASS..."
        if ! keytool -list -v \
          -keystore /tmp/release.keystore \
          -storepass "$CM_KEYSTORE_PASSWORD" \
          -alias "$CM_KEY_ALIAS" \
          -keypass "$CM_KEY_PASSWORD" >/dev/null 2>&1; then
          echo "Alias ($CM_KEY_ALIAS) o CM_KEY_PASSWORD incorrectos."
          exit 1
        fi

        cat >/tmp/build.json <<EOF
        {
          "android": {
            "release": {
              "keystore": "/tmp/release.keystore",
              "storePassword": "$CM_KEYSTORE_PASSWORD",
              "alias": "$CM_KEY_ALIAS",
              "password": "$CM_KEY_PASSWORD",
              "keystoreType": "$TYPE",
              "packageType": "bundle"
            }
          }
        }
        EOF

        echo "Keystore y build.json OK."
    - name: Build RELEASE AAB firmado
      script: |
        set -e

        npx ionic cordova build android --prod --release \
          --buildConfig=/tmp/build.json -- --packageType=bundle


        echo ""
        echo "===== VERIFICACIÓN GRADLE DE DEPENDENCIAS 16 KB ====="
        cd platforms/android

        if [ ! -x "./gradlew" ]; then
          echo "ERROR: gradlew no fue generado después del build."
          ls -la
          exit 1
        fi

        echo "Resolución LazySodium:"
        LAZY_OUT="$(./gradlew :app:dependencyInsight \
          --dependency lazysodium-android \
          --configuration releaseRuntimeClasspath \
          --console=plain)"
        printf '%s\n' "$LAZY_OUT"

        if ! printf '%s\n' "$LAZY_OUT" | grep -Eq 'com\.goterl:lazysodium-android:5\.2\.0'; then
          echo "ERROR: Gradle no seleccionó lazysodium-android 5.2.0"
          exit 1
        fi

        echo ""
        echo "Resolución JNA:"
        JNA_OUT="$(./gradlew :app:dependencyInsight \
          --dependency jna \
          --configuration releaseRuntimeClasspath \
          --console=plain)"
        printf '%s\n' "$JNA_OUT"

        if ! printf '%s\n' "$JNA_OUT" | grep -Eq 'net\.java\.dev\.jna:jna:5\.17\.0'; then
          echo "ERROR: Gradle no seleccionó JNA 5.17.0"
          exit 1
        fi

        echo ""
        echo "Dependencias 16 KB correctas en RELEASE:"
        echo " - LazySodium 5.2.0"
        echo " - JNA 5.17.0"

        cd ../..

        AAB="platforms/android/app/build/outputs/bundle/release/app-release.aab"
        test -f "$AAB" || { echo "No se generó el AAB release"; exit 1; }

        echo "AAB generado:"
        ls -lh "$AAB"

        echo ""
        echo "===== DEPENDENCIAS DEL AAB ====="
        python3 - "$AAB" <<'PY'
        import sys, zipfile, re

        aab = sys.argv[1]
        with zipfile.ZipFile(aab) as z:
            raw = z.read("BUNDLE-METADATA/com.android.tools.build.libraries/dependencies.pb")

        strings = [m.group().decode("utf-8", "ignore") for m in re.finditer(rb"[ -~]{3,}", raw)]

        found = {}
        for i, s in enumerate(strings):
            if s == "com.goterl" and i + 2 < len(strings):
                found["lazysodium"] = strings[i:i+3]
            if s == "net.java.dev.jna" and i + 2 < len(strings):
                found["jna"] = strings[i:i+3]

        for key, values in found.items():
            print(key, "=>", " | ".join(values))

        if "lazysodium" not in found or "5.2.0" not in found["lazysodium"]:
            raise SystemExit("ERROR: el AAB no contiene Lazysodium 5.2.0")

        if "jna" not in found or "5.17.0" not in found["jna"]:
            raise SystemExit("ERROR: el AAB no contiene JNA 5.17.0")

        print("Versiones de dependencias nativas correctas.")
        PY

        echo ""
        echo "===== VALIDACIÓN ELF 16 KB ====="
        python3 - "$AAB" <<'PY'
        import sys, zipfile, struct

        aab = sys.argv[1]

        def load_alignments(data):
            if data[:4] != b"\x7fELF":
                return []

            elfclass = data[4]
            endian = data[5]
            order = "<" if endian == 1 else ">"

            aligns = []

            if elfclass == 1:
                phoff = struct.unpack_from(order + "I", data, 28)[0]
                phentsize = struct.unpack_from(order + "H", data, 42)[0]
                phnum = struct.unpack_from(order + "H", data, 44)[0]

                for i in range(phnum):
                    off = phoff + i * phentsize
                    ptype = struct.unpack_from(order + "I", data, off)[0]
                    if ptype == 1:
                        aligns.append(struct.unpack_from(order + "I", data, off + 28)[0])

            elif elfclass == 2:
                phoff = struct.unpack_from(order + "Q", data, 32)[0]
                phentsize = struct.unpack_from(order + "H", data, 54)[0]
                phnum = struct.unpack_from(order + "H", data, 56)[0]

                for i in range(phnum):
                    off = phoff + i * phentsize
                    ptype = struct.unpack_from(order + "I", data, off)[0]
                    if ptype == 1:
                        aligns.append(struct.unpack_from(order + "Q", data, off + 48)[0])

            return aligns

        bad = []

        with zipfile.ZipFile(aab) as z:
            for name in sorted(z.namelist()):
                if not name.endswith(".so"):
                    continue

                # Google Play está comprobando las ABI de 64 bits.
                if "/arm64-v8a/" not in name and "/x86_64/" not in name:
                    continue

                aligns = load_alignments(z.read(name))
                ok = bool(aligns) and all(a >= 0x4000 for a in aligns)

                print(f"{'OK' if ok else 'FAIL'} {name}: {[hex(a) for a in aligns]}")

                if not ok:
                    bad.append(name)

        if bad:
            print("\nERROR: bibliotecas 64-bit no compatibles con páginas de 16 KB:")
            for name in bad:
                print(" -", name)
            raise SystemExit(20)

        print("\nTodas las bibliotecas arm64-v8a y x86_64 cumplen p_align >= 0x4000.")
        PY

        echo ""
        echo "===== LISTADO DE BIBLIOTECAS NATIVAS ====="
        unzip -l "$AAB" | grep '\.so$' || true

        echo ""
        echo "===== BUNDLE ALIGNMENT ====="
        if command -v bundletool >/dev/null 2>&1; then
          bundletool dump config --bundle="$AAB" | grep -i alignment || true
        else
          BUNDLETOOL_JAR=$(find "${ANDROID_HOME:-/opt/android-sdk}" -iname 'bundletool*.jar' 2>/dev/null | head -n 1)
          if [ -n "$BUNDLETOOL_JAR" ]; then
            java -jar "$BUNDLETOOL_JAR" dump config --bundle="$AAB" | grep -i alignment || true
          else
            echo "bundletool no encontrado; la validación ELF sí fue ejecutada."
          fi
        fi

        echo ""
        echo "Artefactos generados:"
        find platforms/android/app/build/outputs -type f | sed 's#^#  - #'
    artifacts:
    - platforms/android/app/build/outputs/bundle/release/*.aab
    - platforms/android/app/build/outputs/**/*.apk
    - package-lock.json